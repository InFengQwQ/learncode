server:
    port: 8080
    cors_origins:
        - http://localhost:5173
database:
    host: postgres
    port: 5432
    user: learncode
    password: learncode
    dbname: learncode
    sslmode: disable
storage:
    root: /tmp/learncode-storage
llm:
    default: local
    providers:
        - name: local
          endpoint: http://host.docker.internal:1234/v1
          models:
            - google/gemma-4-e4b
            - qwen/qwen3.5-9b
          api_key: not-needed
