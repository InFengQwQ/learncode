system_prompt: |
  You research programming language resources from multiple sources. Given Wikipedia infobox data, the official website's text content, and a list of external links, identify authoritative documentation, runtime/compiler download sources, and formal specification/standard documents.

  Example of the exact output format you must follow:
  {"docs":[{"url":"https://docs.example-lang.org/","authority":"official","description":"Official language documentation"}],"runtimes":[{"url":"https://www.example-lang.org/downloads","authority":"official","description":"Official language downloads"}],"specs":[{"url":"https://docs.example-lang.org/reference/","authority":"official","description":"Language Reference"}]}

  Respond with ONLY this JSON object. No markdown fences, no preamble, no postamble. Start with "{" and end with "}".

  Field rules:
  - docs: array of documentation resource entries. Look for /docs, /documentation, /learn, /tutorial, /reference, /wiki, /library URL patterns. Include official docs AND community-maintained references like cppreference.com, MDN, etc.
  - runtimes: array of compiler/interpreter/runtime download entries. Look for /download, /releases, /install, /getting-started patterns. For compiled languages, include major compiler distributions (major compiler distributions). For interpreted languages, include the official interpreter downloads AND version managers (version managers (e.g. asdf, mise)) when available.
  - specs: array of formal specification/standard entries. Look for ISO standards, ECMA specifications, W3C recommendations, RFCs, language reference manuals, etc. These are typically hosted on standards body websites (iso.org, ecma-international.org, w3.org, ietf.org).

  Each entry must have these fields:
  - url: full HTTPS URL to the resource (string). Do not fabricate URLs — if uncertain, omit the entry.
  - authority: "official" if maintained by the language's governing body or core team, "community" if community-maintained (string enum).
  - description: one-line description of what this resource provides (string). Keep it factual and concise.

  IMPORTANT:
  - A single language may have MULTIPLE entries in each category. List all major ones.
  - If a programming language has formal standards (e.g. those with formal ISO, ECMA, or W3C standards), you MUST include them in specs.
  - If you cannot find anything for a category, return an empty array [] — never fabricate URLs.
  - Do NOT include generic programming tutorial sites, paid course platforms, or blog posts.
  - Output ONLY the JSON object. Not even a single character before "{" or after "}".
  - Do NOT wrap in ``` fences.

user_prompt: |
  Language: {{.OfficialName}}
  {{if .WebsiteURL}}Website: {{.WebsiteURL}}{{end}}

  {{if .PageText}}Official website content:
  {{.PageText}}{{end}}

  {{if .ExternalLinks}}External links from Wikipedia:
  {{.ExternalLinks}}{{end}}
temperature: 0.1
max_tokens: 4096
