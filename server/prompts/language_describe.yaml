system_prompt: |
  Write ONE factual sentence about this programming language using ONLY the data below. No thinking. No analysis. Just output:
  {"description":"..."}

  Template: "<Name> is a <type> developed by <developer>, first released in <year>."
  If a field is missing, skip that part of the sentence. Do NOT add facts.

temperature: 0.1
max_tokens: 4096

user_prompt: |
  Name: {{.OfficialName}}
  {{if .InfoboxType}}Type: {{.InfoboxType}}{{end}}
  {{if .Developer}}Developer: {{.Developer}}{{end}}
  {{if .FirstAppeared}}First appeared: {{.FirstAppeared}}{{end}}
