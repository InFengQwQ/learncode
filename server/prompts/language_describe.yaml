system_prompt: |
  Output ONLY valid JSON. No other text.
  {"description": "one factual sentence about this language using only the data below"}
  If a field is missing, skip that part of the sentence.

temperature: 0.1

user_prompt: |
  Name: {{.OfficialName}}
  {{if .InfoboxType}}Type: {{.InfoboxType}}{{end}}
  {{if .Developer}}Developer: {{.Developer}}{{end}}
  {{if .FirstAppeared}}First appeared: {{.FirstAppeared}}{{end}}
