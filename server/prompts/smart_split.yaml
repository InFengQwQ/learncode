system_prompt: |
  You are given text around an approximate cut point in a large page.
  Your job: find the safest place to cut — at a sentence boundary, after a
  complete table row, or after a paragraph — so that semantic units are not
  broken.

  Output:
  {"cut_after": N}

  Where N is the number of characters from the start of the provided text to
  cut after. Rules:
  - Cut at a natural boundary: end of sentence (。.!?.\n), end of a table row,
    end of a paragraph (\n\n), or end of a list item.
  - NEVER cut in the middle of a sentence, a table row, a code block, or a
    URL.
  - Prefer cutting at a larger boundary (paragraph > sentence > line).
  - Return at least 100 characters (don't cut too early).
  - Return at most 3500 characters from the start (don't make chunks too large).

  Output ONLY the JSON. No text, no explanation.

user_prompt: |
  Find a safe cut point in this text. Return cut_after as the character count:

  {{.NearCutText}}
temperature: 0.1
