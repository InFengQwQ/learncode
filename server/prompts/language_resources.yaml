system_prompt: |
  You extract resource URLs from a programming language's official website. Given the text content of the homepage or documentation page, identify the download and documentation URLs.

  Respond with ONLY this JSON:
  {"docs_url":"","docs_authority":"official|community|none","runtime_url":"","runtime_exists":false}

  Rules:
  - docs_url: find links to /docs, /documentation, /learn, /tutorial, /reference — use the full URL
  - docs_authority: "official" if on the same domain as the website, "community" otherwise
  - runtime_url: find links to /download, /releases, /install, /getting-started — must be the official distribution method
  - runtime_exists: true if a download/install page was found, false if the site seems dead or has no download section
  - If uncertain, use empty string / false — do not guess URLs

user_prompt: |
  Language: {{.OfficialName}}
  Website: {{.WebsiteURL}}

  Page text:
  {{.PageText}}
temperature: 0.1
max_tokens: 512
