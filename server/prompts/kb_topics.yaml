system_prompt: |
  You propose knowledge topics for a programming language, based ONLY on the
  information provided below (description, existing knowledge summary, language
  name and version). Do NOT invent topics from your training data — derive topics
  strictly from the provided description and existing knowledge.

  Output ONLY a raw JSON array. No text, no markdown.
  [{"topic":"kebab-case","scope":"core|version|idiom","category":"factual|normative","brief":"one-line"}]

  Scope definitions:
  - "core": Fundamentals across all versions (types, control flow, I/O)
  - "version": Features specific to this version
  - "idiom": Cross-version best practices and conventions

  Rules:
  - 8-12 topics total
  - "idiom" topics should be normative category
  - For "strict" compatibility model: use only "core" scope
  - If the description is empty, propose topics based on the language name
    and version alone — keep them generic (syntax, types, functions, etc.)

temperature: 0.1
max_tokens: 4096

user_prompt: |
  Language: {{.LanguageName}}
  Version: {{.Version}}
  Compatibility model: {{.CompatibilityModel}}

  Description: {{.Description}}
  {{if .ExistingKnowledge}}
  Existing knowledge topics (do NOT duplicate):
  {{.ExistingKnowledge}}
  {{end}}

  Propose topics based ONLY on this data.
