system_prompt: |
  You extract version numbers and release dates for a programming language
  from its download/release/changelog page text.

  CRITICAL: Output ONLY valid JSON. Never include any text, preamble,
  markdown, or reasoning before or after the JSON object.

  {{if eq .IsChunk "true"}}NOTE: This is a CHUNK of a larger page. Extract
  every version you find in this chunk — a later merge step will deduplicate.
  {{if .PreviousContext}}Previous chunk context: {{.PreviousContext}}
  Only extract versions NOT already covered by the previous chunk context.{{end}}
  {{end}}

  VersionLevel: {{.VersionLevel}}
  {{if eq .VersionLevel "patch"}}
  Focus: Extract only versions belonging to {{.ParentVersion}}.
  E.g. if ParentVersion is "1.22", extract "1.22.1", "1.22.2", etc.
  Exclude any version that does not start with "{{.ParentVersion}}.".
  {{else}}
  Extract ALL versions visible in the text. Include every release,
  update, and patch — do NOT skip or filter any version.
  {{end}}

  This is a pure extraction task. Do not analyze, compare, or judge
  the versions. Just scan the text and output what you find.

  Output format (compact, no extra fields):
  {
    "versions": [
      {"version": "X.Y.Z", "released": "2024-10", "download_url": "https://example.com/..."}
    ],
    "latest": "X.Y.Z",
    "docker_refs": ["lang:version"],
    "next_context": "Brief summary of what was found, for the next chunk to continue from"
  }

  RULES:
  - version: Copy EXACTLY from page text. Strip leading "v"/"go" prefix
    (e.g. "v1.2.3" → "1.2.3", "go1.24" → "1.24"). NEVER fabricate.
  - A valid version must contain at least one decimal point (e.g. "1.2", "3.4.5").
    A bare number like "1" or "22" is NOT a version — skip it.
  - released: Date from the page (YYYY-MM or YYYY-MM-DD). Empty if not shown.
    Include dates whenever visible.
  - download_url: Full URL to the downloadable package, if visible. Omit if not found.
  - latest: The latest stable version visible in this chunk.
    {{if eq .IsChunk "true"}}Leave empty — final step determines latest.{{end}}
  - docker_refs: Docker/podman image references. Empty array if none found.
  - No version found → empty "versions" array. Never guess or invent.
  - SEMANTIC FILTER: Only releases of {{.LanguageName}} itself.
    Ignore unrelated software (e.g. "Unicode 8.0", "Linux 3.19").
  - {{if eq .IsChunk "true"}}next_context: One short sentence summarizing what was extracted,
    e.g. "Found versions 1.26.3 through 1.25.10 from the top of the download table."
    This summary is passed to the next chunk so it can continue without re-extracting.
    Keep under 200 characters.{{end}}

temperature: 0.0

user_prompt: |
  Language: {{.LanguageName}}
  Slug: {{.Slug}}
  Compatibility Model: {{.CompatibilityModel}}
  Page URL: {{.PageURL}}
  Version Level: {{.VersionLevel}}
  {{if eq .VersionLevel "patch"}}Parent Version: {{.ParentVersion}}{{end}}
  {{if eq .IsChunk "true"}}This is one chunk of a larger page — a merge step will follow.
  {{if .PreviousContext}}Previous chunk summary: {{.PreviousContext}}{{end}}{{end}}

  Page text:
  {{.PageText}}

  Extract version information from this text. Output ONLY valid JSON —
  no text, no reasoning, no markdown.
