services:
  postgres:
    image: postgres:16-alpine
    container_name: learncode-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: learncode
      POSTGRES_PASSWORD: learncode
      POSTGRES_DB: learncode
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learncode"]
      interval: 3s
      timeout: 3s
      retries: 10

  accesser:
    build: ./server/accesser
    image: learncode-accesser:latest
    container_name: learncode-accesser
    ports:
      - "7654:7654"
    volumes:
      - ./server/accesser:/accesser
    restart: unless-stopped

  server:
    build: ./server
    image: learncode-server:latest
    container_name: learncode-server
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: learncode
      DATABASE_PASSWORD: learncode
      DATABASE_NAME: learncode
      STORAGE_ROOT: /tmp/learncode-storage
      WIKI_PROXY: http://accesser:7654
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./server/config.yaml:/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      accesser:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./web
    image: learncode-web:latest
    container_name: learncode-web
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata: